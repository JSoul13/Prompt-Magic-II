<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prompt ⚡ Magic</title>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3em;
      margin-bottom: 5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    h1 .bolt {
      color: #ffff33; /* yellow bolt */
      margin: 0 3px;
    }

    h2 {
      font-size: 1.2em;
      margin-top: 0;
      margin-bottom: 30px;
      color: #00aaff; /* blue */
      font-weight: bold;
    }
    h2 .bolt {
      color: #ffff33; /* yellow bolt */
    }

    textarea {
      width: 90%;
      max-width: 600px;
      height: 100px;
      margin-bottom: 20px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 1em;
    }

    select, input, button {
      padding: 10px;
      margin: 10px;
      border-radius: 6px;
      border: none;
      font-size: 1em;
    }

    button {
      background: #ff00cc;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ff33ff;
    }

    .output-wrapper {
      margin-top: 20px;
      width: 90%;
      max-width: 600px;
    }

    .output-header {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4em;
      background: linear-gradient(90deg, #ff00cc, #00ffff);
      color: white;
      text-align: center;
      padding: 8px;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      box-shadow: 0 0 12px #ff00cc;
    }

    .output {
      background: #222;
      padding: 15px;
      border-radius: 0 0 10px 10px;
      white-space: pre-wrap;
      font-size: 1.1em;
      border: 1px solid #444;
    }
  </style>
</head>
<body>
  <h1>Prompt<span class="bolt">⚡</span>Magic</h1>
  <h2>by JI <span class="bolt">⚡</span> Innovations</h2>

  <textarea id="userIdea" placeholder="Type your idea here..."></textarea><br>

  <label for="tone">Tone:</label>
  <select id="tone">
    <option value="default">Default</option>
    <option value="professional">Professional</option>
    <option value="casual">Casual</option>
    <option value="creative">Creative</option>
    <option value="detailed">Detailed</option>
  </select>

  <label for="depth">Depth:</label>
  <select id="depth">
    <option value="surface">Surface</option>
    <option value="moderate">Moderate</option>
    <option value="deep">Deep</option>
  </select>

  <br>
  <input type="text" id="apiKey" placeholder="Optional: Enter API Key for advanced results">
  <br>

  <button onclick="generatePrompt()">✨ Generate Prompt</button>

  <div class="output-wrapper">
    <div class="output-header">⚡ Refined Prompt ⚡</div>
    <div class="output" id="output"></div>
  </div>

  <script>
    function generatePrompt() {
      const idea = document.getElementById("userIdea").value.trim();
      const tone = document.getElementById("tone").value;
      const depth = document.getElementById("depth").value;
      const apiKey = document.getElementById("apiKey").value.trim();

      if (!idea) {
        document.getElementById("output").innerText = "Please enter an idea first!";
        return;
      }

      let refined = "";

      if (tone === "professional") {
        refined += `Write a structured, professional prompt that emphasizes clarity and depth. `;
      } else if (tone === "casual") {
        refined += `Create a relaxed, easy-to-read prompt with a friendly tone. `;
      } else if (tone === "creative") {
        refined += `Generate a unique, imaginative prompt with vivid detail. `;
      } else if (tone === "detailed") {
        refined += `Expand the prompt into a highly detailed version with step-by-step clarity. `;
      }

      if (depth === "moderate") {
        refined += `Add moderate elaboration to ensure thorough coverage of the idea. `;
      } else if (depth === "deep") {
        refined += `Dive deep into specifics, ensuring the prompt captures multiple dimensions of the idea. `;
      }

      refined += `Focus specifically on: "${idea}".`;

      if (apiKey) {
        refined += ` Use advanced AI to ensure maximum precision, context awareness, and creative flexibility.`;
      }

      document.getElementById("output").innerText = refined;
    }
  </script>
</body>
</html>
