<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Prompt⚡Magic</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0f14; --panel:#101726; --card:#141c2a; --text:#eaf0ff; --muted:#8aa0c8;
    --blue:#2ea8ff; --yellow:#ffe44d; --border:#1f2a44; --accent:#34ffc8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .wrap{width:100%; max-width:920px}
  .stack{display:grid; gap:12px}

  /* Header */
  .title{display:flex; flex-direction:column; align-items:center; gap:6px}
  .pm{
    font-family:'Montserrat',system-ui; font-weight:800; letter-spacing:.2px;
    font-size:40px; line-height:1; display:flex; align-items:center;
  }
  .pm .bolt{color:var(--yellow); margin:0 4px; transform:translateY(1px)}
  .byline{
    font-weight:800; color:var(--blue); font-size:16px; line-height:1;
    display:flex; align-items:center; gap:6px;
  }
  .byline .bolt{color:var(--yellow)}

  /* Card + Inputs */
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; box-shadow:0 10px 18px rgba(0,0,0,.35)}
  label{color:#cfe1ff; font-weight:600}
  textarea,input,select{
    width:100%; background:var(--panel); color:var(--text);
    border:1px solid var(--border); border-radius:12px; padding:12px; outline:none;
  }
  textarea::placeholder,input::placeholder{color:var(--muted)}
  textarea:focus,input:focus,select:focus{border-color:var(--accent)}
  .row{display:grid; grid-template-columns:1fr; gap:12px}
  .row3{display:grid; grid-template-columns:1fr; gap:12px}
  @media (min-width:760px){ .row{grid-template-columns:2fr 1fr} .row3{grid-template-columns:1fr 1fr 1fr} }

  .btn{border:0; border-radius:12px; padding:12px 14px; font-weight:900; cursor:pointer; background:var(--accent); color:#06111f}
  .muted{color:var(--muted); font-size:12px}

  /* Output */
  .outWrap{margin-top:6px}
  .outHead{
    font-weight:900; text-align:center; padding:10px 12px; border:1px solid var(--border);
    border-top-left-radius:12px; border-top-right-radius:12px;
    background:linear-gradient(90deg,#ff49e1 0%, #2ea8ff 100%);
    color:#08101e; letter-spacing:.2px;
  }
  .out{
    white-space:pre-wrap; min-height:140px; background:var(--panel);
    border:1px solid var(--border); border-top:0; border-bottom-left-radius:12px; border-bottom-right-radius:12px; padding:12px;
    font-size:1.03rem;
  }

  .footer{margin-top:6px; text-align:center; color:var(--muted); font-size:12px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="stack">
      <!-- Header -->
      <div class="title">
        <div class="pm">Prompt<span class="bolt">⚡</span>Magic</div>
        <div class="byline">by JI <span class="bolt">⚡</span> Innovations</div>
      </div>

      <!-- App -->
      <div class="card">
        <div class="stack">
          <div class="row">
            <div>
              <label for="idea">Your idea</label>
              <textarea id="idea" placeholder="Type your idea…"></textarea>
            </div>
            <div>
              <label for="api">Optional OpenAI API key</label>
              <input id="api" type="password" placeholder="Paste key (kept only in this page)"/>
              <div class="muted">If the browser blocks the call (CORS), it falls back to offline refinement.</div>
            </div>
          </div>

          <div class="row3">
            <div>
              <label for="category">Style</label>
              <select id="category">
                <option value="auto" selected>Auto-detect</option>
                <option value="business">Business plan</option>
                <option value="marketing">Marketing plan</option>
                <option value="ads">Ads / Campaign</option>
                <option value="logo">Logo / Branding</option>
                <option value="naming">Naming</option>
                <option value="slogan">Slogan / Tagline</option>
                <option value="product">Product / App plan</option>
                <option value="uxcopy">UX Copy</option>
                <option value="landing">Landing Page</option>
                <option value="seo">SEO Outline</option>
                <option value="pitch">Pitch Deck</option>
                <option value="video">Video Script</option>
                <option value="social">Social Post</option>
                <option value="email">Email</option>
                <option value="resume">Resume</option>
                <option value="grant">Grant / Proposal</option>
                <option value="research">Research Brief</option>
                <option value="code">Code Plan</option>
                <option value="creative">Creative Writing</option>
                <option value="art">AI Art Prompt</option>
                <option value="generic">Generic</option>
              </select>
            </div>
            <div>
              <label for="vibe">Vibe (optional)</label>
              <select id="vibe">
                <option value="">Auto</option>
                <option>professional</option>
                <option>bold</option>
                <option>friendly</option>
                <option>minimal</option>
                <option>playful</option>
                <option>edgy</option>
              </select>
            </div>
            <div>
              <label for="depth">Depth</label>
              <select id="depth">
                <option>Quick</option>
                <option selected>Standard</option>
                <option>Deep</option>
              </select>
            </div>
          </div>

          <button class="btn" id="generate">Generate Prompt</button>

          <div class="outWrap">
            <div class="outHead">⚡ Refined Prompt</div>
            <div id="out" class="out"></div>
          </div>
        </div>
      </div>

      <div class="footer">© <span id="yr"></span> JI ⚡ Innovations</div>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  $('yr').textContent = new Date().getFullYear();

  const lc = s => (s||'').toLowerCase();

  // Pull a concise subject from the idea (no verb-echo)
  function extractSubject(raw){
    if(!raw) return '';
    let s = ' ' + raw.trim();
    s = s.replace(/^\s*(please|can you|could you|would you|help me|i (?:want|need|would like|wanna) to|we need to)\s+/i,'');
    const forMatch = s.match(/\bfor\s+([^.,;]+?)(?=[.,;]|$)/i);
    if(forMatch && forMatch[1].trim().length >= 4) return forMatch[1].trim();
    s = s.replace(/^\s*(create|write|make|build|design|draft|develop|generate|prepare|plan)\s+(?:an?\s+|the\s+)?/i,'');
    s = s.replace(/[.?!\s]+$/,'').trim();
    return s;
  }

  // Detect hints to enrich the prompt
  function detectHints(txt){
    const t = lc(txt);
    return {
      costs: /cost|budget|pricing|expenses|capex|opex|financial|projection/.test(t),
      timeline: /timeline|time\s*line|deadline|12[-\s]*month|quarter|within\s+\w+/.test(t),
      staffing: /hire|staff|team|roles|headcount|agents?|recruit|shift/.test(t),
      metrics: /kpi|metric|goal|target|forecast|roi/.test(t),
      compliance: /compliance|hipaa|gdpr|pci|regulation|licensing/.test(t),
      location: (txt.match(/\bin\s+([A-Z][A-Za-z\-\s]+)(?=[.,;]|$)/) || [,''])[1],
      medical: /(treatment|clinic|patient|health|medical|therapy|rehab)/.test(t)
    };
  }

  // Intent detection (when Style = Auto)
  function detectIntent(txt){
    const x = lc(txt);
    if(/\bbusiness\s*plan|startup|company|store|shop|venture|call\s*center\b/.test(x)) return 'business';
    if(/\bmarketing|campaign|ads?|media|growth|funnel\b/.test(x)) return 'marketing';
    if(/\bad|advert|facebook|instagram|tiktok|google\s*ads|copy\b/.test(x)) return 'ads';
    if(/\blogo|brand\s*identity|wordmark|visual\s*identity\b/.test(x)) return 'logo';
    if(/\bname|naming\b/.test(x)) return 'naming';
    if(/\bslogan|tagline|headline\b/.test(x)) return 'slogan';
    if(/\bapp|website|web\s*site|saas|platform|product\b/.test(x)) return 'product';
    if(/\bux|microcopy|cta|onboarding\b/.test(x)) return 'uxcopy';
    if(/\blanding\s?page|homepage\b/.test(x)) return 'landing';
    if(/\bseo|keywords?|meta|search\b/.test(x)) return 'seo';
    if(/\bpitch\s*deck|investor|slides?\b/.test(x)) return 'pitch';
    if(/\bvideo|script|storyboard|youtube|reel\b/.test(x)) return 'video';
    if(/\bpost|tweet|thread|caption|social\b/.test(x)) return 'social';
    if(/\bemail|newsletter|cold\s*email\b/.test(x)) return 'email';
    if(/\bresume|cv|cover\s*letter\b/.test(x)) return 'resume';
    if(/\bgrant|proposal|rfp\b/.test(x)) return 'grant';
    if(/\bresearch|analysis|report|brief\b/.test(x)) return 'research';
    if(/\bcode|api|backend|frontend|database|react|node|python\b/.test(x)) return 'code';
    if(/\bstory|novel|poem|horror|romance|thriller|script\b/.test(x)) return 'creative';
    if(/\bmidjourney|stable\s*diffusion|ai\s*art|image\s*prompt\b/.test(x)) return 'art';
    return 'generic';
  }

  // Builders — only the final, task-ready prompt (no meta/rules/placeholders)
  const builders = {
    business: (sub,h,depth) => {
      const bits = [];
      if(h.costs) bits.push("startup and operating costs with key assumptions");
      if(h.timeline) bits.push("a 12-month launch timeline with milestones");
      if(h.staffing) bits.push("a staffing plan with roles, headcount, and shift coverage");
      if(h.metrics) bits.push("key KPIs and a first-year financial projection");
      if(h.compliance || h.medical) bits.push("required compliance (e.g., HIPAA) and licensing");
      if(bits.length===0) bits.push("market analysis, pricing model, go-to-market, and a simple first-year projection");
      const where = h.location ? ` in ${h.location}` : "";
      const core = `Create a detailed business plan for ${sub}${where}, including ${bits.join(", ")}.`;
      if(depth==='Deep') return core + " Include competitor mapping and break-even analysis.";
      if(depth==='Quick') return core;
      return core;
    },
    marketing: (sub,h,depth)=> {
      const core = `Develop a practical marketing plan for ${sub} with a clear goal, positioning, starter channels, three creative angles, a budget split, and success criteria for a two-week test.`;
      return depth==='Deep' ? core + " Add a simple measurement framework and next-step playbook." : core;
    },
    ads: (sub)=> `Write three paid social ad variants for ${sub}, each with a strong hook, one concrete benefit, a proof element, and a direct call-to-action.`,
    logo: (sub)=> `Propose two logo directions for ${sub}: one bold and geometric, one minimal and typographic, each with a one-sentence rationale and a quick usage mock idea.`,
    naming: (sub)=> `Propose eight strong names for ${sub}, each with a short meaning note and a plausible .com idea.`,
    slogan: (sub)=> `Write ten tight taglines for ${sub}, each under seven words and focused on one sharp benefit.`,
    product: (sub,h)=> {
      const add=[]; if(h.timeline) add.push("a staged v1 timeline"); if(h.costs) add.push("rough build/operate cost tiers");
      return `Outline a v1 product plan for ${sub} with the primary user journey, must-have features only, a trimmed scope that still delivers value${add.length?`, ${add.join(", ")}`:""}, and a short launch checklist.`;
    },
    uxcopy: (sub)=> `Write crisp UX copy for ${sub}: a clear headline, a one-sentence value message, three short benefits, and two call-to-action options.`,
    landing: (sub)=> `Draft landing page copy for ${sub} with a strong headline, subhead, three benefits, a proof idea, and one clear call-to-action.`,
    seo: (sub,h,depth)=> depth==='Deep'
      ? `Create an SEO outline for ${sub} with a primary keyword, four supporting keywords, a suggested title tag, a meta description under 160 characters, and a simple H2/H3 structure.`
      : `Create an SEO outline for ${sub} with a primary keyword, supporting keywords, a suggested title tag, and a meta description under 160 characters.`,
    pitch: (sub)=> `Draft a concise pitch deck outline for ${sub} covering problem, solution, market, model, traction, go-to-market, competition, team, and a clear ask.`,
    video: (sub)=> `Write a 45-second video script for ${sub} with a hook in the first two seconds, a simple story arc, one benefit, and a direct call-to-action.`,
    social: (sub)=> `Write three social posts for ${sub}, each with a clear takeaway and a short call-to-action; include one variant formatted as a hook plus two lines.`,
    email: (sub)=> `Write a short cold email for ${sub} with a tight subject, one-sentence value, one proof, and a single call-to-action.`,
    resume: (sub)=> `Rewrite resume bullets for ${sub} with strong action verbs, measurable outcomes, and concise phrasing suitable for a one-page layout.`,
    grant: (sub)=> `Draft a grant proposal summary for ${sub} with the need, proposed solution, expected impact, a simple budget, and a realistic timeline.`,
    research: (sub)=> `Create a quick research plan for ${sub}: key questions, where to look, the terms to search, and how to judge viability in a day.`,
    code: (sub)=> `Outline a development plan for ${sub} with minimal architecture, core data models, key endpoints, and a simple step-by-step build order.`,
    creative: (sub)=> `Write a short story based on ${sub} with a striking opening image, a rising turn, and a memorable last line.`,
    art: (sub)=> `Create an image prompt about ${sub} with a clear focal point, evocative lighting, and a defined composition.`,
    generic: (sub,h,depth)=> {
      const more=[]; if(h.costs) more.push("costs with key assumptions"); if(h.timeline) more.push("timeline and milestones"); if(h.metrics) more.push("clear success metrics");
      const core = `Produce a complete deliverable for ${sub}${more.length?`, including ${more.join(", ")}`:""}.`;
      return depth==='Deep' ? core + " Add a simple risk/mitigation note." : core;
    }
  };

  function chooseIntent(txt){
    const chosen = $('category').value;
    if(chosen !== 'auto') return chosen;
    return detectIntent(txt);
  }

  function offlineRefine(){
    const raw = $('idea').value || '';
    const depth = $('depth').value || 'Standard';
    const subject = extractSubject(raw);
    if(!subject) return "Turn this idea into a clear, specific prompt with the deliverable, the essentials to include, and any constraints that matter.";

    const hints = detectHints(raw);
    const cat = chooseIntent(raw);
    const make = builders[cat] || builders.generic;
    return make(subject, hints, depth);
  }

  function sanitizeModelOutput(s){
    if(!s) return "";
    let t = s.trim();
    t = t.replace(/```[\s\S]*?```/g, m => m.replace(/```[a-zA-Z]*\n?|```/g, ""));
    t = t.replace(/^(you are|act as|rules?:|requirements?:|format:|tone:|steps?:)/gim, '').trim();
    t = t.replace(/^\s*[-*].*$/gim, '').replace(/^#{1,6}\s.*$/gm, '').trim();
    t = t.replace(/\n{2,}/g,' ').replace(/\s{2,}/g,' ').trim();
    return t;
  }

  async function refineWithOpenAI(idea, key){
    const subject = extractSubject(idea);
    const cat = chooseIntent(idea);
    const depth = $('depth').value || 'Standard';

    const sys = "Rewrite the user's idea as a single, concrete prompt tailored to the subject. Include the subject (rephrased), add missing essentials, and avoid meta/rules/headings/placeholders. Output only the final prompt.";
    const user = JSON.stringify({ idea: idea, subject, category: cat, depth });

    const r = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        temperature: 0.35,
        messages: [
          { role: "system", content: sys },
          { role: "user", content: user }
        ],
        max_tokens: 320
      })
    });
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    return sanitizeModelOutput(j?.choices?.[0]?.message?.content || "");
  }

  $('generate').addEventListener('click', async () => {
    const idea = $('idea').value.trim();
    const key = $('api').value.trim();
    const out = $('out');

    if(!idea){ out.textContent = "Please enter an idea."; return; }
    out.textContent = "Refining…";

    if(key){
      try{
        const refined = await refineWithOpenAI(idea, key);
        out.textContent = refined || offlineRefine();
        return;
      }catch(e){
        out.textContent = offlineRefine() + "\n\n(Online refinement failed; used offline mode.)";
        return;
      }
    }

    out.textContent = offlineRefine();
  });
</script>
</body>
</html>
