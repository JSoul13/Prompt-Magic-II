<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prompt ⚡️Magic by JI Innovations</title>
  <style>
    body { background:#0d0d0d; color:#e0e0e0; font-family:Arial,sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .container { background:#1a1a1a; padding:20px; border-radius:10px; width:90%; max-width:600px; box-shadow:0 0 20px #0ff, 0 0 40px #f0f; }
    h1 { text-align:center; color:#0ff; }
    textarea, select, input { width:100%; margin:10px 0; padding:10px; border-radius:5px; border:none; font-size:1em; }
    button { width:100%; padding:12px; background:linear-gradient(90deg,#0ff,#f0f); border:none; border-radius:5px; color:black; font-weight:bold; cursor:pointer; font-size:1.1em; }
    button:hover { opacity:0.8; }
    .output { margin-top:20px; padding:15px; background:#0d0d0d; border-radius:5px; white-space:pre-wrap; }
    label { font-weight:bold; color:#f0f; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Prompt ⚡️Magic<br><small>by JI Innovations</small></h1>
    <label>Your Idea:</label>
    <textarea id="idea" rows="4" placeholder="Type your idea here..."></textarea>

    <label>Optional API Key (for better AI):</label>
    <input type="password" id="apiKey" placeholder="Paste your key (optional)" />

    <button onclick="generatePrompt()">Generate Prompt</button>

    <div class="output" id="output">Your refined prompt will appear here...</div>
  </div>

  <script>
    async function generatePrompt() {
      const idea = document.getElementById('idea').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const output = document.getElementById('output');

      if (!idea) {
        output.textContent = "Please enter an idea first!";
        return;
      }

      // If API key present, call OpenAI
      if (apiKey) {
        try {
          output.textContent = "Refining your idea into a powerful prompt... ✨";
          const response = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + apiKey
            },
            body: JSON.stringify({
              model: "gpt-4o-mini",
              messages: [
                {
                  role: "system",
                  content: "You are a prompt refining assistant. Rewrite the user’s raw idea into a single, clear, powerful prompt they can copy-paste into any AI. Do NOT repeat their idea word-for-word. Do NOT include instructions or rules. Just output the improved prompt."
                },
                { role: "user", content: idea }
              ],
              max_tokens: 200
            })
          });

          if (!response.ok) throw new Error("API request failed");
          const data = await response.json();
          output.textContent = data.choices?.[0]?.message?.content?.trim() || "Error: No response.";
        } catch (err) {
          output.textContent = "Error: " + err.message;
        }
      } else {
        // No API key → basic offline fallback (not great, but works)
        output.textContent = `Refined Prompt:\nWrite a clear, detailed response about: ${idea}`;
      }
    }
  </script>
</body>
</html>
