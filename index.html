<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prompt ⚡️Magic by JI Innovations</title>
  <style>
    body { background:#0d0d0d; color:#e0e0e0; font-family:Arial,sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .container { background:#1a1a1a; padding:20px; border-radius:10px; width:90%; max-width:650px; box-shadow:0 0 20px #0ff, 0 0 40px #f0f; }
    h1 { text-align:center; font-size:2em; }
    .title-main { background:linear-gradient(90deg,#0ff,#f0f); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:bold; }
    .title-sub { color:#FFD700; font-size:0.6em; }
    .title-sub .bolt { color:#ff0; text-shadow:0 0 5px #ff0; }
    textarea, input { width:100%; margin:10px 0; padding:10px; border-radius:5px; border:none; font-size:1em; }
    button { width:100%; padding:12px; background:linear-gradient(90deg,#0ff,#f0f); border:none; border-radius:5px; color:black; font-weight:bold; cursor:pointer; font-size:1.1em; }
    button:hover { opacity:0.8; }
    .output { margin-top:20px; padding:15px; background:#0d0d0d; border-radius:5px; white-space:pre-wrap; font-size:1.05em; }
    label { font-weight:bold; color:#f0f; }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <span class="title-main">Prompt Magic</span><br>
      <span class="title-sub">by JI <span class="bolt">⚡️</span> Innovations</span>
    </h1>

    <label>Your Idea:</label>
    <textarea id="idea" rows="4" placeholder="Type your idea here..."></textarea>

    <label>Optional OpenAI API Key (for smarter results):</label>
    <input type="password" id="apiKey" placeholder="Paste your key (optional)" />

    <button onclick="generatePrompt()">Generate Prompt</button>

    <div class="output" id="output">Your refined prompt will appear here...</div>
  </div>

  <script>
    async function generatePrompt() {
      const idea = document.getElementById('idea').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const output = document.getElementById('output');

      if (!idea) {
        output.textContent = "⚠️ Please enter an idea first!";
        return;
      }

      if (apiKey) {
        try {
          output.textContent = "🔮 Refining your idea into a clean prompt...";

          const response = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + apiKey
            },
            body: JSON.stringify({
              model: "gpt-4o-mini",
              messages: [
                {
                  role: "system",
                  content: "You are a professional prompt engineer. Your ONLY task is to transform the user’s rough idea into a new, clear, and effective prompt. Do not repeat their text. Rewrite it into a stronger prompt with detail and structure."
                },
                { role: "user", content: idea }
              ],
              max_tokens: 300
            })
          });

          if (!response.ok) throw new Error("Request failed: " + response.status);

          const data = await response.json();
          const refined = data.choices?.[0]?.message?.content?.trim();

          output.textContent = refined || "⚠️ No response from AI.";
        } catch (err) {
          output.textContent = "❌ Error: " + err.message + "\n(This may be blocked by browser CORS. Works best with a small proxy server.)";
        }
      } else {
        output.textContent = "✨ Refined Prompt:\n" + improveLocally(idea);
      }
    }

    function improveLocally(idea) {
      // Make a new structured prompt without echoing user input
      let refined = "";

      if (idea.toLowerCase().includes("business")) {
        refined = "Create a comprehensive business plan including market analysis, financial projections, competitor research, and a step-by-step strategy.";
      } else if (idea.toLowerCase().includes("story")) {
        refined = "Write a detailed story with characters, setting, rising action, conflict, and resolution in an engaging style.";
      } else if (idea.toLowerCase().includes("app")) {
        refined = "Design a complete mobile app concept including features, user journey, monetization strategy, and suggested tech stack.";
      } else if (idea.toLowerCase().includes("marketing")) {
        refined = "Develop a creative marketing campaign with goals, audience targeting, content strategy, and measurable KPIs.";
      } else {
        refined = "Generate a detailed and creative response with clarity, depth, and actionable insight.";
      }

      return refined;
    }
  </script>
</body>
</html>
